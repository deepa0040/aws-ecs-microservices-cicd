name: Build and Push Images to ECR

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build and push images from'
        required: true
        default: 'master'
      aws_region:
        description: 'AWS region for ECR'
        required: true
        default: 'us-west-2'

concurrency:
  group: build-push-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and Push - ${{ matrix.service }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: products-service
            context: services/products-service
            repository: ecs-demo/products-service
          - service: users-service
            context: services/users-service
            repository: ecs-demo/users-service
          - service: orders-service
            context: services/orders-service
            repository: ecs-demo/orders-service
          - service: frontend
            context: services/frontend
            repository: ecs-demo/frontend
          - service: sidecar-logger
            context: services/sidecar-logger
            repository: ecs-demo/sidecar-logger
          - service: init-check
            context: services/init-check
            repository: ecs-demo/init-check
          - service: cron-report
            context: services/cron-report
            repository: ecs-demo/cron-report

    steps:

      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      # --------------------------------------------------
      # 2. Configure AWS credentials
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::008893372207:role/ci-testing
          role-session-name: github-actions
          aws-region: ${{ inputs.aws_region }}

      # --------------------------------------------------
      # 3. Login to Amazon ECR
      # --------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------
      # 4. Set image tags
      #    - full SHA: immutable audit trail, used by check step below
      #    - short SHA: human-readable convenience tag
      #    - short SHA + run number: guarantees uniqueness even on
      #      repeat runs of the same commit
      # --------------------------------------------------
      - name: Set image tags
        run: |
          echo "FULL_SHA=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "RUN_TAG=${GITHUB_SHA::7}-${{ github.run_number }}" >> $GITHUB_ENV

      # --------------------------------------------------
      # 5. Duplicate-build guard
      #    Checks the FULL SHA tag (matches what's actually pushed
      #    below), so this now correctly detects a repeat build of
      #    the same commit and skips rebuilding it.
      # --------------------------------------------------
      - name: Check if image already exists for this SHA
        id: check
        run: |
          if aws ecr describe-images --repository-name ${{ matrix.repository }} \
            --image-ids imageTag=${{ env.FULL_SHA }} 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # --------------------------------------------------
      # 6. Set up Docker Buildx (required for cache-from/cache-to)
      # --------------------------------------------------
      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------
      # 7. Build and push image with GitHub Actions layer caching,
      #    scoped per service so matrix jobs don't collide.
      #    Guarded by the same check as step 6 — build only runs
      #    if this exact commit hasn't already been pushed.
      # --------------------------------------------------
      - name: Build and push ${{ matrix.service }} image
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repository }}:${{ env.FULL_SHA }}
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repository }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repository }}:${{ env.RUN_TAG }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # --------------------------------------------------
      # 8. Display pushed image info
      # --------------------------------------------------
      - name: Display image information
        run: |
          if [ "${{ steps.check.outputs.exists }}" == "true" ]; then
            echo "Skipped — image already exists for this commit:"
            echo "${{ steps.login-ecr.outputs.registry }}/${{ matrix.repository }}:${{ env.FULL_SHA }}"
          else
            echo "Image pushed successfully:"
            echo "${{ steps.login-ecr.outputs.registry }}/${{ matrix.repository }}:${{ env.FULL_SHA }}"
          fi