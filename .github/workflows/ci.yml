name: Build and Push Images to ECR

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build and push images from'
        required: true
        default: 'master'
      aws_region:
        description: 'AWS region for ECR'
        required: true
        default: 'us-east-1'

env:
  ECR_PRODUCT_REPOSITORY: ecs-demo/products-service
  ECR_USERS_REPOSITORY: ecs-demo/users-service
  ECR_ORDERS_REPOSITORY: ecs-demo/orders-service
  ECR_FRONTEND_REPOSITORY: ecs-demo/frontend
  ECR_SIDECAR_REPOSITORY: ecs-demo/sidecar-logger
  ECR_INIT_CHECK_REPOSITORY: ecs-demo/init-check
  ECR_CRON_REPORT_REPOSITORY: ecs-demo/cron-report

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      # --------------------------------------------------
      # 2. Configure AWS credentials
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::008893372207:role/ci-testing
          role-session-name: github-actions
          aws-region: ${{ inputs.aws_region }}

      # --------------------------------------------------
      # 3. Login to Amazon ECR
      # --------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      # Add Docket build cache
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

    
      # --------------------------------------------------
      # 4. Set image tag
      # --------------------------------------------------
      # Set image tag
      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # Setup Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PRODUCTS
      - name: Build and Push PRODUCT image
        uses: docker/build-push-action@v6
        with:
          context: services/products-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_PRODUCT_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_PRODUCT_REPOSITORY }}:latest
          cache-from: type=gha,scope=products-service
          cache-to: type=gha,mode=max,scope=products-service

      # USERS
      - name: Build and Push USERS image
        uses: docker/build-push-action@v6
        with:
          context: services/users-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_USERS_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_USERS_REPOSITORY }}:latest
          cache-from: type=gha,scope=users-service
          cache-to: type=gha,mode=max,scope=users-service

      # ORDERS
      - name: Build and Push ORDERS image
        uses: docker/build-push-action@v6
        with:
          context: services/orders-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_ORDERS_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_ORDERS_REPOSITORY }}:latest
          cache-from: type=gha,scope=orders-service
          cache-to: type=gha,mode=max,scope=orders-service

      # FRONTEND
      - name: Build and Push FRONTEND image
        uses: docker/build-push-action@v6
        with:
          context: services/frontend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # SIDECAR
      - name: Build and Push SIDECAR image
        uses: docker/build-push-action@v6
        with:
          context: services/sidecar-logger
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_SIDECAR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_SIDECAR_REPOSITORY }}:latest
          cache-from: type=gha,scope=sidecar-logger
          cache-to: type=gha,mode=max,scope=sidecar-logger

      # INIT CHECK
      - name: Build and Push INIT CHECK image
        uses: docker/build-push-action@v6
        with:
          context: services/init-check
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_INIT_CHECK_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_INIT_CHECK_REPOSITORY }}:latest
          cache-from: type=gha,scope=init-check
          cache-to: type=gha,mode=max,scope=init-check

      # CRON REPORT
      - name: Build and Push CRON REPORT image
        uses: docker/build-push-action@v6
        with:
          context: services/cron-report
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_CRON_REPORT_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_CRON_REPORT_REPOSITORY }}:latest
          cache-from: type=gha,scope=cron-report
          cache-to: type=gha,mode=max,scope=cron-report

      # --------------------------------------------------
      # 19. Display pushed images
      # --------------------------------------------------
      - name: Display image information
        run: |
          echo "Images pushed successfully:"
          echo "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_PRODUCT_REPOSITORY }}:${IMAGE_TAG}"
          echo "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_USERS_REPOSITORY }}:${IMAGE_TAG}"
          echo "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_ORDERS_REPOSITORY }}:${IMAGE_TAG}"
          echo "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPOSITORY }}:${IMAGE_TAG}"
          echo "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_SIDECAR_REPOSITORY }}:${IMAGE_TAG}"
          echo "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_INIT_CHECK_REPOSITORY }}:${IMAGE_TAG}"
          echo "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_CRON_REPORT_REPOSITORY }}:${IMAGE_TAG}"