name: Build and Push Images to ECR

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1          # adjust to your region

jobs:
  build-and-push:
    strategy:
      fail-fast: false
      matrix:
        service:
          - products-service
          - users-service
          - orders-service
          - frontend
          - sidecar-logger
          - init-check
          - cron-report
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # needed if using OIDC to assume AWS role
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}   # or use access keys
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}          # adjust if your folder layout differs
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ matrix.service }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ matrix.service }}:latest
          cache-from: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/${{ matrix.service }}:buildcache,mode=max