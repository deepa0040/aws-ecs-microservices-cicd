name: Build and Push Images to ECR

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build and push images from'
        required: true
        default: 'master'
      aws_region:
        description: 'AWS region for ECR'
        required: true
        default: 'us-east-1'

jobs:
  build-and-push:
    name: Build and Push - ${{ matrix.service }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: products-service
            context: services/products-service
            repository: ecs-demo/products-service
          - service: users-service
            context: services/users-service
            repository: ecs-demo/users-service
          - service: orders-service
            context: services/orders-service
            repository: ecs-demo/orders-service
          - service: frontend
            context: services/frontend
            repository: ecs-demo/frontend
          - service: sidecar-logger
            context: services/sidecar-logger
            repository: ecs-demo/sidecar-logger
          - service: init-check
            context: services/init-check
            repository: ecs-demo/init-check
          - service: cron-report
            context: services/cron-report
            repository: ecs-demo/cron-report

    steps:

      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      # --------------------------------------------------
      # 2. Configure AWS credentials
      # --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::008893372207:role/ci-testing
          role-session-name: github-actions
          aws-region: ${{ inputs.aws_region }}

      # --------------------------------------------------
      # 3. Login to Amazon ECR
      # --------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------
      # 4. Set image tag
      # --------------------------------------------------
      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # --------------------------------------------------
      # 5. Build image (plain Docker CLI - no buildx,
      #    no image index, no attestation manifests)
      # --------------------------------------------------
      - name: Build ${{ matrix.service }} image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repository }}:${{ env.IMAGE_TAG }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repository }}:latest \
            ${{ matrix.context }}

      # --------------------------------------------------
      # 6. Push image
      # --------------------------------------------------
      - name: Push ${{ matrix.service }} image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repository }}:${{ env.IMAGE_TAG }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ matrix.repository }}:latest

      # --------------------------------------------------
      # 7. Display pushed image info
      # --------------------------------------------------
      - name: Display image information
        run: |
          echo "Image pushed successfully:"
          echo "${{ steps.login-ecr.outputs.registry }}/${{ matrix.repository }}:${{ env.IMAGE_TAG }}"
          echo "${{ steps.login-ecr.outputs.registry }}/${{ matrix.repository }}:latest"