apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.productsService.replicas }}
  selector:
    matchLabels: { app: products-service }
  template:
    metadata:
      labels: { app: products-service }
    spec:
      containers:
        - name: products-service
          image: "{{ .Values.image.registry }}/products-service:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 4002 }]
          readinessProbe:
            httpGet: { path: /health, port: 4002 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 4002 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{ toYaml .Values.productsService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: products-service
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: products-service }
  ports:
    - port: 4002
      targetPort: 4002
